server:
  port: ${SERVER_PORT:8080}

spring:
  data:
    mongodb:
      # Production: injected via env (MONGODB_URI). Local dev falls back to inline creds.
      # NEVER commit real prod credentials — the `admin:admin` fallback below is
      # only useful in local dev when the env var is unset. In production,
      # `/etc/default/qurandaily-backend` sets MONGODB_URI to the real URI.
      uri: ${MONGODB_URI:mongodb+srv://admin:admin@cluster0.zfinwu5.mongodb.net/quranappdb?appName=Cluster0}
      database: ${SPRING_DATA_MONGODB_DATABASE:quranappdb}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.islamicwebsite: ${LOG_LEVEL:INFO}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

quran:
  data:
    root: ${QURAN_DATA_ROOT:../quran-data}
