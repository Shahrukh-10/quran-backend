server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/quran-h2;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.islamicwebsite: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html

quran:
  data:
    root: ../quran-data
